<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu - Carte du Canada</title>
  <style>
    :root {
      --primary: #2B6CB0;
      --bg: #EDF2F7;
      --card: #FFFFFF;
      --text: #2D3748;
      --prov-color: #E53E3E; /* Rouge provinces */
      --cap-color: #3182CE;  /* Bleu capitales */
      --success: #38A169;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    header { width: 100%; max-width: 950px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-back { background: #CBD5E0; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; color: #1A202C; }
    .btn-back:hover { background: #A0AEC0; }
    
    .game-card { background: var(--card); border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 950px; padding: 18px; text-align: center; }
    
    .hud { display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; background: #F7FAFC; padding: 10px; border-radius: 10px; border: 1px solid #E2E8F0; }
    .score-box { font-size: 1.15rem; font-weight: 700; color: var(--primary); }
    .target-box { font-size: 1.25rem; font-weight: bold; background: #EBF8FF; color: #2B6CB0; padding: 6px 16px; border-radius: 8px; border: 1px solid #BEE3F8; }
    
    .mode-select { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
    .btn-mode { padding: 8px 14px; border-radius: 8px; border: 2px solid transparent; font-weight: 600; cursor: pointer; background: #EDF2F7; }
    .btn-mode.active-prov { background: #FED7D7; color: #9B2C2C; border-color: #E53E3E; }
    .btn-mode.active-cap { background: #BEE3F8; color: #2B6CB0; border-color: #3182CE; }
    
    .map-container { position: relative; width: 100%; max-width: 900px; margin: 0 auto; border-radius: 10px; overflow: hidden; background: #E2E8F0; border: 2px solid #CBD5E0; }
    .map-container img { width: 100%; height: auto; display: block; user-select: none; }
    
    .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; border: 2.5px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.4); transition: transform 0.15s ease; }
    .dot:hover { transform: translate(-50%, -50%) scale(1.35); z-index: 20; }
    .dot.province { background-color: var(--prov-color); }
    .dot.capital { background-color: var(--cap-color); }
    
    .dot.correct { background-color: var(--success) !important; border-color: #C6F6D5; animation: pop 0.3s ease; }
    .dot.wrong { background-color: #718096 !important; animation: shake 0.3s ease; }

    #feedback { margin-top: 12px; font-weight: bold; min-height: 24px; font-size: 1.05rem; }

    @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.8); } 50% { transform: translate(-50%, -50%) scale(1.4); } 100% { transform: translate(-50%, -50%) scale(1); } }
    @keyframes shake { 0%, 100% { transform: translate(-50%, -50%); } 25% { transform: translate(-55%, -50%); } 75% { transform: translate(-45%, -50%); } }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-back">⬅ Menu principal</a>
    <h2>Jeu interactif du Canada 🍁</h2>
    <div></div>
  </header>

  <div class="game-card">
    <div class="mode-select">
      <button id="btn-mode-prov" class="btn-mode active-prov" onclick="setMode('province')">Mode : Provinces et Territoires (Rouge)</button>
      <button id="btn-mode-cap" class="btn-mode" onclick="setMode('capital')">Mode : Capitales (Bleu)</button>
    </div>

    <div class="hud">
      <div class="score-box">Score : <span id="score">0</span> / <span id="total-questions">13</span></div>
      <div>Où se trouve : <span id="target-name" class="target-box">...</span> ?</div>
      <button class="btn-back" onclick="initGame()" style="font-size:0.85rem;">Recommencer</button>
    </div>

    <div class="map-container" id="map-container">
     <img src="canada.png" alt="Carte du Canada">
      <!-- Les pastilles interactives seront générées ici -->
    </div>

    <div id="feedback"></div>
  </div>

  <script>
    const data = [
      { id: "BC", name: "Colombie-Britannique", cap: "Victoria", provX: 19.5, provY: 65, capX: 18.2, capY: 76 },
      { id: "AB", name: "Alberta", cap: "Edmonton", provX: 29.5, provY: 67, capX: 29.2, capY: 63.5 },
      { id: "SK", name: "Saskatchewan", cap: "Regina", provX: 39, provY: 70, capX: 41, capY: 76.5 },
      { id: "MB", name: "Manitoba", cap: "Winnipeg", provX: 49, provY: 70, capX: 51, capY: 78.5 },
      { id: "ON", name: "Ontario", cap: "Toronto", provX: 62, provY: 74, capX: 68.5, capY: 88.5 },
      { id: "QC", name: "Québec", cap: "Québec", provX: 74, provY: 65, capX: 77.8, capY: 77.5 },
      { id: "NB", name: "Nouveau-Brunswick", cap: "Fredericton", provX: 83.5, provY: 76.5, capX: 82.8, capY: 78.2 },
      { id: "NS", name: "Nouvelle-Écosse", cap: "Halifax", provX: 87, provY: 81, capX: 86.8, capY: 82.5 },
      { id: "PE", name: "Île-du-Prince-Édouard", cap: "Charlottetown", provX: 86.2, provY: 76.2, capX: 86.8, capY: 76.8 },
      { id: "NL", name: "Terre-Neuve-et-Labrador", cap: "Saint-Jean", provX: 88, provY: 63, capX: 95.5, capY: 71.5 },
      { id: "YT", name: "Yukon", cap: "Whitehorse", provX: 16, provY: 38, capX: 17, capY: 46 },
      { id: "NT", name: "Territoires du Nord-Ouest", cap: "Yellowknife", provX: 30, provY: 41, capX: 31.5, capY: 47 },
      { id: "NU", name: "Nunavut", cap: "Iqaluit", provX: 55, provY: 37, capX: 73.5, capY: 46 }
    ];

    let currentMode = "province";
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-prov').className = mode === 'province' ? 'btn-mode active-prov' : 'btn-mode';
      document.getElementById('btn-mode-cap').className = mode === 'capital' ? 'btn-mode active-cap' : 'btn-mode';
      initGame();
    }

    function initGame() {
      score = 0;
      currentQuestionIndex = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('feedback').innerText = "";
      
      // Mélanger les questions
      questions = [...data].sort(() => 0.5 - Math.random());
      document.getElementById('total-questions').innerText = questions.length;

      renderDots();
      nextQuestion();
    }

    function renderDots() {
      const container = document.getElementById('map-container');
      container.querySelectorAll('.dot').forEach(d => d.remove());

      data.forEach(item => {
        const dot = document.createElement('div');
        dot.className = `dot ${currentMode}`;
        const x = currentMode === "province" ? item.provX : item.capX;
        const y = currentMode === "province" ? item.provY : item.capY;
        
        dot.style.left = `${x}%`;
        dot.style.top = `${y}%`;
        dot.setAttribute('data-id', item.id);
        dot.onclick = () => handleDotClick(item.id, dot);
        container.appendChild(dot);
      });
    }

    function nextQuestion() {
      if (currentQuestionIndex >= questions.length) {
        document.getElementById('target-name').innerText = "Terminé !";
        const percent = Math.round((score / questions.length) * 100);
        document.getElementById('feedback').innerHTML = `🎉 Bravo ! Partie terminée. Résultat : ${score}/${questions.length} (${percent}%)`;
        return;
      }

      const q = questions[currentQuestionIndex];
      const label = currentMode === "province" ? q.name : q.cap;
      document.getElementById('target-name').innerText = label;
    }

    function handleDotClick(clickedId, element) {
      if (currentQuestionIndex >= questions.length) return;
      if (element.classList.contains('correct')) return;

      const currentQ = questions[currentQuestionIndex];

      if (clickedId === currentQ.id) {
        score++;
        document.getElementById('score').innerText = score;
        element.classList.add('correct');
        document.getElementById('feedback').innerHTML = `<span style="color:var(--success)">Excellent ! C'est bien exact.</span>`;
        currentQuestionIndex++;
        setTimeout(() => {
          document.getElementById('feedback').innerText = "";
          nextQuestion();
        }, 800);
      } else {
        element.classList.add('wrong');
        const correctName = currentMode === "province" ? currentQ.name : currentQ.cap;
        document.getElementById('feedback').innerHTML = `<span style="color:#E53E3E">Ce n'est pas là ! Essaie encore de trouver ${correctName}.</span>`;
        setTimeout(() => element.classList.remove('wrong'), 600);
      }
    }

    window.onload = initGame;
  </script>
</body>
</html>
