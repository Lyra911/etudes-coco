<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Calibreur de Carte</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f4f8; margin: 0; padding: 20px; }
    #info-box { background: white; padding: 15px; border-radius: 10px; max-width: 800px; margin: 0 auto 15px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    #coord-display { font-size: 1.3rem; font-weight: bold; color: #e53e3e; }
    .map-container { position: relative; display: inline-block; border: 2px solid #333; }
    img { display: block; max-width: 900px; width: 100%; height: auto; }
    .point { position: absolute; width: 20px; height: 20px; background: red; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  </style>
</head>
<body>

  <div id="info-box">
    <h2>🎯 Outil de calibrage Coco</h2>
    <p>Cliquez au centre de n'importe quelle province sur la carte ci-dessous :</p>
    <div id="coord-display">Cliquez sur la carte !</div>
  </div>

  <div class="map-container" id="box">
    <img id="ma-carte" src="canada.png" alt="Carte">
  </div>

  <script>
    const img = document.getElementById('ma-carte');
    const box = document.getElementById('box');
    const disp = document.getElementById('coord-display');

    img.addEventListener('click', function(e) {
      const rect = img.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
      const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);

      disp.innerHTML = `Dernier clic : <strong>x: ${x}, y: ${y}</strong>`;

      // Affiche un point rouge là où vous venez de cliquer
      const old = document.querySelector('.point');
      if (old) old.remove();
      const pt = document.createElement('div');
      pt.className = 'point';
      pt.style.left = x + '%';
      pt.style.top = y + '%';
      box.appendChild(pt);
    });
  </script>
</body>
</html>
