<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Méga-Jeu : Le Grand Défi des Parcs Naturels et des Galápagos</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #27ae60;
      --accent: #e74c3c;
      --bg: #f5f6fa;
      --card-bg: #ffffff;
      --text: #2f3640;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    h1 {
      color: var(--primary);
      text-align: center;
      margin-top: 0;
      font-size: 1.8rem;
    }
    .nav-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #718093;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      background: #f1f2f6;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .btn {
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      display: block;
      width: 100%;
      margin-top: 20px;
    }
    .btn:hover {
      background-color: #219653;
    }
    .option-btn {
      background-color: white;
      color: var(--text);
      border: 2px solid #dcdde1;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .option-btn:hover {
      border-color: var(--secondary);
      background-color: #f8f9fa;
    }
    .option-btn.correct {
      background-color: #d4edda;
      border-color: #28a745;
      color: #155724;
    }
    .option-btn.incorrect {
      background-color: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }
    .feedback {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
    }
    .hidden {
      display: none;
    }
    /* Style pour le Memory / Association */
    .grid-matching {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    .match-card {
      padding: 15px;
      background: #f8f9fa;
      border: 2px solid #ced6e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .match-card.selected {
      border-color: var(--secondary);
      background: #e8f5e9;
    }
    .match-card.matched {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
      cursor: default;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-top">
    <button onclick="window.location.href='index.html'" style="background:none; border:none; color:#3498db; cursor:pointer; font-weight:bold;">⬅ Menu principal</button>
    <span id="stage-indicator">Étape 1 sur 5</span>
  </div>

  <h1 id="game-title">Méga-Défi : Les Parcs Naturels & Les Galápagos</h1>
  
  <div class="hud" id="hud-container">
    <div>Score : <span id="score">0</span> / 5</div>
  </div>

  <div id="game-content">
    <!-- Le contenu dynamique du jeu s'insère ici -->
  </div>

  <button id="next-btn" class="btn hidden" onclick="nextStage()">Étape suivante ➜</button>
</div>

<script>
  let currentStage = 1;
  let score = 0;

  const stages = [
    {
      title: "Salle 1 : Définitions et Critères de l'UNESCO",
      type: "quiz",
      question: "Quel critère de l'UNESCO correspond à : « Des exemples remarquables de l'histoire de la Terre (processus géologiques, volcans, formation des îles) » ?",
      options: [
        "Critère (vii) - Esthétique",
        "Critère (viii) - Géologique",
        "Critère (ix) - Écologique et biologique",
        "Critère (x) - Biodiversité"
      ],
      correct: 1,
      explanation: "Exact ! Le critère (viii) concerne l'histoire de la Terre et les processus géologiques majeurs."
    },
    {
      title: "Salle 2 : Charles Darwin et l'Évolution",
      type: "quiz",
      question: "Qu'est-ce que Darwin a principalement observé chez les pinsons des Galápagos pour élaborer sa théorie ?",
      options: [
        "Leur couleur de plumage identique sur toutes les îles.",
        "Leurs becs différents adaptés à la nourriture disponible sur chaque île.",
        "Leur capacité à migrer vers l'Amérique du Sud chaque hiver.",
        "Leur régime strictement carnivore."
      ],
      correct: 1,
      explanation: "Parfait ! Les formes de becs variaient selon l'île et l'alimentation (graines dures, insectes, cactus)."
    },
    {
      title: "Salle 3 : Simulation de Garde-Parc (Gestion des Menaces)",
      type: "quiz",
      question: "Un touriste souhaite nourrir un iguane marin avec des morceaux de pain sur une plage protégée. Que devez-vous faire selon les règlements ?",
      options: [
        "Lui permettre de le faire rapidement si l'iguane a l'air affamé.",
        "Lui interdire fermement (règle : ne pas nourrir les animaux pour éviter de perturber leur santé et leurs habitudes).",
        "L'encourager à utiliser des biscuits à la place du pain."
      ],
      correct: 1,
      explanation: "Exact ! Nourrir la faune stresse les animaux et perturbe leur équilibre naturel."
    },
    {
      title: "Salle 4 : Les Organismes de Conservation",
      type: "quiz",
      question: "Quel organisme québécois gère plusieurs parcs nationaux et réserves au Québec ?",
      options: [
        "Parcs Canada",
        "L'UNESCO",
        "La Sépaq",
        "L'UICN"
      ],
      correct: 2,
      explanation: "Bien joué ! La Sépaq est l'organisme québécois qui gère les parcs et réserves de la province."
    },
    {
      title: "Salle 5 : Association des Notions Clés (Memory Croisé)",
      type: "matching",
      instruction: "Associe chaque terme à sa bonne définition ou caractéristique :",
      pairs: [
        { term: "Espèce endémique", match: "Espèce qu'on ne trouve que dans une seule région" },
        { term: "UICN", match: "Évalue l'état des espèces et produit la Liste rouge" },
        { term: "Parc national Banff", match: "Le plus ancien parc fédéral au Canada" },
        { term: "Zone de protection absolue", match: "Espace réservé à la recherche scientifique sans touristes" }
      ]
    }
  ];

  function loadStage() {
    const stage = stages[currentStage - 1];
    document.getElementById("game-title").innerText = stage.title;
    document.getElementById("stage-indicator").innerText = `Étape ${currentStage} sur ${stages.length}`;
    
    const container = document.getElementById("game-content");
    container.innerHTML = "";
    document.getElementById("next-btn").classList.add("hidden");

    if (stage.type === "quiz") {
      let html = `<p style="font-weight: 500; font-size: 1.1rem;">${stage.question}</p>`;
      stage.options.forEach((opt, idx) => {
        html += `<button class="option-btn" onclick="checkQuiz(${idx}, ${stage.correct}, this)">${opt}</button>`;
      });
      html += `<div id="feedback" class="feedback"></div>`;
      container.innerHTML = html;
    } 
    else if (stage.type === "matching") {
      let html = `<p style="font-weight: 500;">${stage.instruction}</p>`;
      html += `<div class="grid-matching" id="matching-grid">`;
      
      // Mélanger les termes et les définitions séparément
      let terms = stage.pairs.map((p, i) => ({ text: p.term, id: i, type: 'term' }));
      let matches = stage.pairs.map((p, i) => ({ text: p.match, id: i, type: 'match' }));
      
      shuffle(terms);
      shuffle(matches);

      html += `<div id="column-terms">`;
      terms.forEach(t => {
        html += `<div class="match-card" data-id="${t.id}" data-type="term" onclick="selectCard(this)">${t.text}</div>`;
      });
      html += `</div>`;

      html += `<div id="column-matches">`;
      matches.forEach(m => {
        html += `<div class="match-card" data-id="${m.id}" data-type="match" onclick="selectCard(this)">${m.text}</div>`;
      });
      html += `</div>`;

      html += `</div><div id="feedback" class="feedback"></div>`;
      container.innerHTML = html;
    }
  }

  let selectedTerm = null;
  let selectedMatch = null;
  let matchedPairsCount = 0;

  function selectCard(card) {
    if (card.classList.contains("matched")) return;

    if (card.dataset.type === "term") {
      document.querySelectorAll("#column-terms .match-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      selectedTerm = card;
    } else {
      document.querySelectorAll("#column-matches .match-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      selectedMatch = card;
    }

    if (selectedTerm && selectedMatch) {
      if (selectedTerm.dataset.id === selectedMatch.dataset.id) {
        selectedTerm.classList.remove("selected");
        selectedMatch.classList.remove("selected");
        selectedTerm.classList.add("matched");
        selectedMatch.classList.add("matched");
        matchedPairsCount++;
        
        selectedTerm = null;
        selectedMatch = null;

        if (matchedPairsCount === stages[currentStage - 1].pairs.length) {
          score++;
          document.getElementById("score").innerText = score;
          document.getElementById("feedback").innerText = "🎉 Bravo ! Toutes les paires sont correctement associées.";
          document.getElementById("feedback").style.color = "#27ae60";
          document.getElementById("next-btn").classList.remove("hidden");
        }
      } else {
        document.getElementById("feedback").innerText = "❌ Ce n'est pas la bonne association. Réessaie !";
        document.getElementById("feedback").style.color = "#e74c3c";
        setTimeout(() => {
          if(selectedTerm) selectedTerm.classList.remove("selected");
          if(selectedMatch) selectedMatch.classList.remove("selected");
          selectedTerm = null;
          selectedMatch = null;
        }, 800);
      }
    }
  }

  function checkQuiz(selectedIndex, correctIndex, btnElement) {
    const stage = stages[currentStage - 1];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback");

    buttons.forEach(b => b.disabled = true);

    if (selectedIndex === correctIndex) {
      btnElement.classList.add("correct");
      feedback.innerText = "✅ " + stage.explanation;
      feedback.style.color = "#27ae60";
      score++;
      document.getElementById("score").innerText = score;
    } else {
      btnElement.classList.add("incorrect");
      buttons[correctIndex].classList.add("correct");
      feedback.innerText = "❌ Oups ! " + stage.explanation;
      feedback.style.color = "#e74c3c";
    }

    document.getElementById("next-btn").classList.remove("hidden");
  }

  function nextStage() {
    currentStage++;
    matchedPairsCount = 0;
    if (currentStage <= stages.length) {
      loadStage();
    } else {
      showVictory();
    }
  }

  function showVictory() {
    document.getElementById("game-title").innerText = "🏆 Félicitations ! Diplôme d'Expert obtenu !";
    document.getElementById("stage-indicator").innerText = "Terminé";
    document.getElementById("hud-container").style.display = "none";
    
    document.getElementById("game-content").innerHTML = `
      <div style="text-align: center; padding: 20px;">
        <h2>Tu as complété le Grand Défi avec un score de ${score} / ${stages.length} !</h2>
        <p>Tu maîtrises maintenant à la perfection les parcs naturels, les îles Galápagos, l'UNESCO, Darwin et la protection de l'environnement.</p>
        <button class="btn" onclick="restartGame()">Rejouer au Méga-Défi</button>
      </div>
    `;
    document.getElementById("next-btn").classList.add("hidden");
  }

  function restartGame() {
    currentStage = 1;
    score = 0;
    document.getElementById("score").innerText = score;
    document.getElementById("hud-container").style.display = "flex";
    loadStage();
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  // Lancement du jeu
  loadStage();
</script>

</body>
</html>
